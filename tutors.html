<nav class="site-nav">
  <div class="wrap">
    <a href="index.html" class="brand">ABC Tutoring</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="tutors.html" class="active">Find a Tutor</a>
    </div>
  </div>
</nav>

<div class="wrap">
  <section style="padding-top:40px;">
    <h1 style="font-size:1.9rem;">Find a tutor</h1>
    <p style="color:var(--ink-soft);">Filter by subject, then pick a tutor to see their open times.</p>

    <div class="filter-row" id="filter-row"></div>
    <div class="tutor-grid" id="tutor-grid"></div>
  </section>
</div>

<footer>
  <div class="wrap">ABC Tutoring &middot; Prototype site</div>
</footer>

<script src="data.js"></script>
<script>
  let activeSubject = 'All';

  function renderFilters() {
    const row = document.getElementById('filter-row');
    const subjects = ['All', ...ALL_SUBJECTS];
    row.innerHTML = subjects.map(s =>
      `<button class="filter-chip ${s === activeSubject ? 'active' : ''}" data-subject="${s}">${s}</button>`
    ).join('');
    row.querySelectorAll('.filter-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        activeSubject = btn.dataset.subject;
        posthog.capture('subject_filtered', { subject: activeSubject });
        renderFilters();
        renderTutors();
      });
    });
  }

  function renderTutors() {
    const grid = document.getElementById('tutor-grid');
    const list = activeSubject === 'All'
      ? TUTORS
      : TUTORS.filter(t => t.subjects.includes(activeSubject));

    if (list.length === 0) {
      grid.innerHTML = '<p class="no-slots">No tutors currently teach this subject.</p>';
      return;
    }

    grid.innerHTML = list.map(t => `
      <a class="tutor-card" href="booking.html?tutor=${t.id}" data-tutor="${t.id}">
        <div class="avatar" style="background:${avatarColor(t.id)}">${initials(t.name)}</div>
        <h3>${t.name}</h3>
        <p class="tutor-meta">${t.grades}</p>
        <div class="tag-row">${t.subjects.map(s => `<span class="tag">${s}</span>`).join('')}</div>
        <span class="rate">$${t.rate}/hr</span>
      </a>
    `).join('');

    grid.querySelectorAll('.tutor-card').forEach(card => {
      card.addEventListener('click', () => {
        const t = getTutorById(card.dataset.tutor);
        posthog.capture('tutor_profile_viewed', {
          tutor_name: t.name,
          subjects: t.subjects,
          rate: t.rate
        });
      });
    });
  }

  renderFilters();
  renderTutors();
</script>
</body>
</html>
